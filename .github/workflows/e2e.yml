name: E2E tests

# Runs the real-browser Playwright suite (e2e/patient-journey.spec.ts)
# against a build wired to a disposable TEST Supabase project -- never
# production. See e2e/README.md for the one-time setup this depends on
# (creating that test project + adding E2E_SUPABASE_URL / E2E_SUPABASE_ANON_KEY
# as repo secrets). If those secrets aren't set yet, this job will fail at
# the build step with a clear missing-env-var error rather than silently
# hitting production, since there is no fallback to the hardcoded prod
# credentials once these env vars are wired into the build step below.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      grep:
        description: 'Optional: only run tests whose title/tag matches this (e.g. "app loads and renders" or "@posture"). Leave blank to run the full suite.'
        required: false
        default: ''

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Was 20. Suite has grown to 114 tests, 2 workers, 2 retries, 90s/test --
    # a bad run (several genuine failures each burning 3x90s) can legitimately
    # need well over 20 minutes just to finish and produce a report, let alone
    # pass. A run that gets cut off mid-way produces confusing partial output
    # (old errors mixed with new, empty artifacts) that looks like a fix
    # didn't take when it's actually just an unfinished run. 45 min gives a
    # full-suite run real room to complete either way.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Catches a bad E2E_SUPABASE_URL secret (missing "https://", stray
      # quotes/spaces from a copy-paste, etc.) here with a clear message,
      # instead of letting it through into the build where it later throws
      # inside the browser at "new URL()" / "createClient()" time. That
      # failure mode is nasty: the whole JS bundle crashes before React ever
      # mounts, so #root stays permanently empty and every test just times
      # out with a generic "expect #root toBeVisible -> hidden" -- no hint
      # that a secret was the actual cause. (This bit us on 2026-08-07.)
      - name: Validate test Supabase secrets look like real values
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
        run: |
          node -e '
            const url = process.env.E2E_SUPABASE_URL || "";
            const key = process.env.E2E_SUPABASE_ANON_KEY || "";
            let bad = [];
            if (!url) bad.push("E2E_SUPABASE_URL is empty/unset.");
            else {
              try { new URL(url); } catch { bad.push(`E2E_SUPABASE_URL is not a valid URL: "${url}"`); }
              if (/["'"'"'\s]/.test(url)) bad.push(`E2E_SUPABASE_URL contains quotes or whitespace -- check for a copy-paste mistake: "${url}"`);
            }
            if (!key) bad.push("E2E_SUPABASE_ANON_KEY is empty/unset.");
            else if (/["'"'"'\s]/.test(key)) bad.push("E2E_SUPABASE_ANON_KEY contains quotes or whitespace -- check for a copy-paste mistake.");
            if (bad.length) {
              for (const b of bad) console.log("::error::" + b);
              console.log("::error::Fix in GitHub: Settings -> Secrets and variables -> Actions -> click the secret name -> Update -> paste ONLY the raw value, no quotes, no extra spaces, no trailing newline.");
              process.exit(1);
            }
            console.log("Secrets look structurally valid (not verifying they are the CORRECT project, just that they are well-formed).");
          '

      - name: Build against the disposable test Supabase project
        env:
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
        run: npm run build

      # src/supabase.js falls back to the real production project
      # (gkhcysvayjrkrufcnqvz) via `||` whenever VITE_SUPABASE_URL is unset
      # or empty -- which is exactly what happens if E2E_SUPABASE_URL is
      # missing/blank in this repo's Actions secrets. That fallback is
      # silent: `npm run build` above succeeds either way, so nothing
      # upstream catches it. Confirmed locally that a build with no env
      # vars set bakes the literal prod project ref into dist/ with no
      # error. Fail loudly here instead of letting E2E silently run
      # (and potentially write real-looking test data) against production.
      - name: Guard against silently building against production Supabase
        run: |
          if grep -rq "gkhcysvayjrkrufcnqvz" dist/; then
            echo "::error::Build output references the PRODUCTION Supabase project (gkhcysvayjrkrufcnqvz). This means VITE_SUPABASE_URL/VITE_SUPABASE_ANON_KEY were empty or unset during build -- check the E2E_SUPABASE_URL / E2E_SUPABASE_ANON_KEY repo secrets (Settings -> Secrets and variables -> Actions). Refusing to run E2E tests against production."
            exit 1
          fi

      - name: Run E2E tests
        env:
          CI: true
          GREP: ${{ github.event.inputs.grep }}
          # commands.spec.ts / ortho-cases.spec.ts / therapist-mobile.spec.ts log
          # into an EXISTING account (appMap.ts's login()) rather than signing up --
          # only patient-journey.spec.ts self-signs-up a disposable account. Locally
          # that existing account comes from the gitignored e2e/login.local.json;
          # in CI there's no such file, so creds() falls back to these env vars.
          # The account itself still has to be created once, by hand, in the
          # TEST Supabase project (Authentication -> Users -> Add user, Auto
          # Confirm User on) -- these secrets just need to match its email/password.
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          # Whole-suite runs were hitting the 20-minute job timeout before
          # Playwright ever wrote its report (every test failing the same way
          # at 90s x 3 retries adds up fast across ~94 tests), so the
          # playwright-report artifact kept coming up empty -- not missing,
          # just never created. A --grep filter (set via the "grep" input
          # when running this workflow manually) lets a single fast test run
          # to completion so a report actually gets produced.
          # ai-accuracy.spec.ts (@ai-accuracy) makes real, non-deterministic
          # Groq calls and lives in its own scheduled workflow
          # (ai-accuracy.yml) -- excluded here by default so it doesn't
          # burn Groq quota or add LLM-output flakiness to every push/PR.
          # An explicit grep (e.g. "@ai-accuracy") still overrides this.
          # load-concurrency.spec.ts (@load) spins up many concurrent
          # browser contexts against the test Supabase project -- heavier
          # and not something every push/PR needs to pay for either. It has
          # its own on-demand workflow (load-test.yml). An explicit grep
          # (e.g. "@load") still overrides this.
          if [ -n "$GREP" ]; then
            npx playwright test --grep "$GREP"
          else
            npx playwright test --grep-invert "@ai-accuracy|@load"
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      # smoke-starter.spec.ts calls page.screenshot() unconditionally (pass
      # or fail) to e2e-screenshot.png at the repo root -- separate from the
      # HTML report, and the fastest way to literally see what the browser
      # rendered without digging through the report.
      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshot
          path: e2e-screenshot.png
          if-no-files-found: ignore
          retention-days: 14
