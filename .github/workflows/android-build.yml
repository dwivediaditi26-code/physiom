name: Android build

# Builds the Capacitor Android app from the same web build Vercel serves and
# uploads the result as a downloadable artifact (Actions tab -> pick a run ->
# "Artifacts" at the bottom of the summary page).
#
#   - Debug APK: always built. Installs on any Android phone for testing
#     (the phone has to allow "install unknown apps"). Not for the Play Store.
#   - Signed release AAB + APK: only built once the four ANDROID_* secrets
#     below exist. The AAB is the file Google Play asks for.
#
# Release signing secrets (Settings -> Secrets and variables -> Actions ->
# New repository secret). All optional until you're ready for the Play Store:
#   ANDROID_KEYSTORE_BASE64    your upload keystore, base64-encoded
#                              (macOS: `base64 -i upload.jks | pbcopy`)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password
# Create the keystore once with:
#   keytool -genkeypair -v -keystore upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000
# and keep that file + passwords somewhere safe OUTSIDE this repo -- losing
# them means you can't ship updates under the same Play listing.
#
# Nothing here touches Supabase test/prod secrets: src/supabase.js falls back
# to the production project when VITE_SUPABASE_* are unset, which is exactly
# what the Vercel production build does too, so the app in the APK talks to
# the same backend as the live site.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'supabase/**'
      - 'e2e/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'supabase/**'
      - 'e2e/**'
  workflow_dispatch: {}

# A newer push to the same branch cancels the older, now-pointless build.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # @capacitor/cli 8 requires Node >= 22 (the other workflows still use
      # 20, which is fine for them -- they never run the Capacitor CLI).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # android/gradle/gradle-daemon-jvm.properties pins the Gradle daemon to
      # JetBrains Runtime 21 (Android Studio's own JDK). Installing exactly
      # that here means Gradle uses it directly instead of downloading one.
      - uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          # Optional -- same as Vercel: crash reporting stays off if unset.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build

      - name: Copy web build into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: physiomind-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Secrets can't be read in a step's `if:` directly, so check once here
      # and expose a plain true/false for the release steps below.
      - name: Check for release signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64 secret not set -- skipped the signed release AAB/APK. The debug APK was still built."
          fi

      - name: Build signed release AAB + APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          # android.injected.signing.* is how Android Studio's own "Generate
          # Signed Bundle/APK" signs -- no signing config (or password) ever
          # needs to live in android/app/build.gradle.
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload signed release AAB + APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: physiomind-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Delete decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
