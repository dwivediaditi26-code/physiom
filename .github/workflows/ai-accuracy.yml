name: AI accuracy (real Groq)

# Nightly + on-demand accuracy check for the AI intake pipeline
# (src/aiIntakeTestHarness.js's 15 built-in cases) against a REAL deployed
# instance -- real /api/parse, real Groq, real region-detection scoring.
#
# Deliberately separate from e2e.yml:
#   - costs real Groq tokens per run (small, but non-zero -- the point is
#     genuinely testing the live model, not a mock)
#   - non-deterministic by nature (LLM output varies run to run), so it's
#     scored against a threshold in e2e/ai-accuracy.spec.ts, not asserted
#     per-case like the rest of the suite -- doesn't belong gating every PR
#   - hits a live deployment directly (window.physioAITest runs before
#     login and touches no Supabase/patient data -- see the spec file), so
#     none of e2e.yml's Supabase test-project secrets are needed here
#
# See e2e/ai-accuracy.spec.ts for the scoring logic and threshold.

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC nightly
  workflow_dispatch: {}

jobs:
  ai-accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium only -- this is an API-accuracy check, not a viewport check)
        run: npx playwright install --with-deps chromium

      - name: Run AI accuracy check against live deployment
        env:
          CI: true
          E2E_BASE_URL: https://physiom-sbs4.vercel.app
        run: npx playwright test --project=chromium --grep "@ai-accuracy"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-accuracy-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30
