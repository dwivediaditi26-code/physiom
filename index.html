<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="description" content="PhysioMind — Physiotherapy Assessment & Education (not a medical device; not medical advice)" />

    <!-- PWA / App install -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PhysioMind" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Preconnect to speed up external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts: Inter (Onboarding tour card), Baloo 2 + Nunito Sans (PhysioFeed's
         Explore board, the "Candy Coat" look) and Caveat (the handwritten tagline on
         the PhysioFeed profile header; scoped via .pf-font-head/.pf-font-body/
         .pf-font-quote in physiofeed.css, not applied app-wide).
         ONE request, and it must never block the first screen: a normal stylesheet
         link in <head> keeps the page blank until it arrives, and on a weak
         connection that can be many seconds (or forever). media="print" makes the
         browser fetch it without waiting; the onload flips it on. Until the fonts
         arrive the system font is shown (font-display: swap). -->
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap" /></noscript>

    <!-- The <i class="ti ti-*"> icons (Ortho Objective Assessment, setup screens,
         tour) come from a small font we ship ourselves: src/fonts/tabler-icons-subset.*,
         imported in src/main.jsx. It used to be the full Tabler font from a third-party
         site (213 KB of CSS that blocked the first screen, plus a 507 KB font). -->

    <!-- Favicon (was pointing at a nonexistent /favicon.svg — now a real generated icon) -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Critical CSS inlined — prevents flash of unstyled content -->
    <style>
      /* Base reset — prevents layout shift */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html {
        height: 100%;
        background: #F7F7F8;
      }
      body {
        min-height: 100%;
        min-height: 100dvh;
        background: #F7F7F8;
        font-family: system-ui, -apple-system, BlinkMacSystemFont,
                     'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* Prevent text size adjustment on mobile rotation */
        -webkit-text-size-adjust: 100%;
      }

      /* App Store / Play Store native-feel hardening (App Store Review
         Guideline 4.2 — reviewers reject apps that "feel like a website":
         no tap-highlight flash, no double-tap-to-zoom delay, no rubber-band
         overscroll bounce past page edges, no accidental text selection on
         taps). Inputs/textareas keep normal text selection so clinical
         note-taking and copy/paste still work. */
      * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
      body { overscroll-behavior-y: none; user-select: none; -webkit-user-select: none; }
      input, textarea, [contenteditable="true"] { user-select: text; -webkit-user-select: text; }

      /* Loading screen — shown before React hydrates */
      #root:empty::after {
        content: '';
        position: fixed;
        inset: 0;
        background: #f5f0fb;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      /* Loading spinner visible before JS loads */
      #app-loader {
        position: fixed;
        inset: 0;
        background: #f5f0fb;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 9999;
        transition: opacity 0.3s;
      }
      #app-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loader-ring {
        width: 40px;
        height: 40px;
        border: 3px solid #ede7f6;
        border-top-color: #7c3aed;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .loader-text {
        font-size: 0.8rem;
        color: #7e6a9a;
        font-weight: 500;
        letter-spacing: 0.3px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Prevent scrollbar layout shift */
      html { scrollbar-gutter: stable; }

      /* Touch optimisations for mobile */
      button, [role="button"] {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      /* Smooth scrolling */
      html { scroll-behavior: smooth; }

      /* Input base — prevents zoom on iOS (font-size must be ≥16px) */
      input, select, textarea {
        font-size: 16px; /* prevents iOS zoom on focus */
      }
      @media (min-width: 768px) {
        input, select, textarea { font-size: inherit; }
      }
      /* Pain (NRS) slider — larger track + thumb so it is easy to drag
         precisely on a phone instead of jumping straight to 10. */
      input[type="range"].pm-nrs-range { -webkit-appearance: none; appearance: none; background: transparent; }
      input[type="range"].pm-nrs-range:focus { outline: none; }
      input[type="range"].pm-nrs-range::-webkit-slider-runnable-track { height: 8px; border-radius: 6px; background: #E4E1F5; }
      input[type="range"].pm-nrs-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 26px; height: 26px; margin-top: -9px; border-radius: 50%; background: #6C5CE7; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.28); cursor: pointer; }
      input[type="range"].pm-nrs-range::-moz-range-track { height: 8px; border-radius: 6px; background: #E4E1F5; }
      input[type="range"].pm-nrs-range::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #6C5CE7; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.28); cursor: pointer; }
    </style>

    <title>PhysioMind — Physiotherapy Assessment & Education</title>
  </head>
  <body>

    <!-- Loading indicator shown before React loads -->
    <div id="app-loader">
      <div class="loader-ring"></div>
      <div class="loader-text">PhysioMind</div>
    </div>

    <!-- React mounts here -->
    <div id="root"></div>

    <!-- Hide loader once React takes over -->
    <script>
      // Hide loader as soon as React renders anything
      const observer = new MutationObserver(() => {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          const loader = document.getElementById('app-loader');
          if (loader) {
            loader.classList.add('hidden');
            setTimeout(() => loader.remove(), 400);
          }
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
    </script>

    <!-- Main app bundle — Vite injects this -->
    <script type="module" src="/src/main.jsx"></script>
    <!-- The service worker is registered from src/main.jsx (src/pwa/registerServiceWorker.js): production web build only, not inside the Android/iOS app. -->
  </body>
</html>
